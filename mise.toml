[tasks.preflight]
description = "Names a missing Rust toolchain, cargo-nextest or sibling crates and modmanager checkout before a build turns it into an obscure error"
dir = "{{config_root}}"
run = [
  '''pwsh -NoProfile -Command "if (-not (Test-Path '../modmanager/crates/amm-client/Cargo.toml')) { Write-Error 'modmanager not found at ../modmanager (path dependencies need it next to stratum)'; exit 1 }"''',
  "rustc --version",
  "cargo --version",
  "cargo nextest --version",
]

[tasks.check]
description = "cargo check, clippy with warnings denied, and rustfmt check over the Stratum crates"
dir = "{{config_root}}"
run = [
  "cargo check --workspace --all-targets",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo fmt -p stratum-core -p stratum-ui -p stratum-ffi -p stratum-tools --check",
]

[tasks.test]
description = "Every workspace test through cargo-nextest"
dir = "{{config_root}}"
run = "cargo nextest run --workspace"

[tasks.bench]
description = "Every stratum-core Criterion bench, at most 8 build jobs; arguments after the task name filter the benches"
dir = "{{config_root}}"
env = { CARGO_BUILD_JOBS = "8" }
run = "cargo bench -p stratum-core"

[tasks.header]
description = "Regenerates shim/include/stratum.h from the stratum-ffi crate"
dir = "{{config_root}}"
run = "cbindgen --config stratum/ffi/cbindgen.toml --crate stratum-ffi --output shim/include/stratum.h stratum/ffi"

[tasks.header-check]
description = "Fails when shim/include/stratum.h is out of date with the stratum-ffi crate"
dir = "{{config_root}}"
run = "cbindgen --verify --config stratum/ffi/cbindgen.toml --crate stratum-ffi --output shim/include/stratum.h stratum/ffi"

[tasks."i18n:extract"]
description = "Writes stratum/ui/i18n/stratum.pot from the StratumMessage enum"
dir = "{{config_root}}"
run = "cargo run -q -p stratum-ui --example stratum_i18n_extract"

[tasks."i18n:check"]
description = "Fails when stratum/ui/i18n/stratum.pot is out of date with the StratumMessage enum"
dir = "{{config_root}}"
run = "cargo run -q -p stratum-ui --example stratum_i18n_extract -- --check"

[tasks.build-ffi]
description = "Builds the stratum_ffi static library in release mode"
dir = "{{config_root}}"
run = "cargo build --release -p stratum-ffi"

[tasks.build-mod]
description = "Builds the LeviLamina mod into shim/bin/alaydriem-stratum"
depends = ["build-ffi", "header"]
dir = "{{config_root}}/shim"
# -r: levibuildscript 0.6.2 deletes its prelink library after each link but skips the prelink when only
# stratum_ffi.lib changed, so an incremental relink fails with LNK1181 bedrock_runtime_api.lib
run = ["xmake f -p windows -a x64 -m release -y", "xmake -r -y -j 8"]

[tasks.install-mod]
description = "Copies the built mod into the game mods folder named by LM_MODS_DIR (set it in mise.local.toml)"
depends = ["build-mod"]
dir = "{{config_root}}"
shell = "bash -c"
# LeviLamina finds a mod's folder from the manifest name, so the folder carries that name
run = 'mkdir -p "${LM_MODS_DIR:?set LM_MODS_DIR in mise.local.toml}/alaydriem-stratum" && cp -r shim/bin/alaydriem-stratum/. "$LM_MODS_DIR/alaydriem-stratum/"'

[tools]
"cargo:cbindgen" = "0.29.2"
"github:xmake-io/xmake" = "3.1.1"

[tasks.samples]
description = "Writes the synthetic .mcstructure samples into samples/ at the repo root"
dir = "{{config_root}}"
run = "cargo run -q --release -p stratum-tools --bin generate_samples -- samples"
