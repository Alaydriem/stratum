name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and attach assets to'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check that every version matches the tag
        shell: pwsh
        run: |
          $tag = $env:TAG.TrimStart('v')
          $tooth = (Get-Content tooth.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $xmake = (Select-String -Path shim/xmake.lua -Pattern 'modVersion = "([^"]+)"').Matches[0].Groups[1].Value
          "tag=$tag tooth.json=$tooth Cargo.toml=$cargo shim/xmake.lua=$xmake"
          if ($tooth -ne $tag -or $cargo -ne $tag -or $xmake -ne $tag) {
            Write-Error "versions do not match the tag $tag"
            exit 1
          }
          "VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: jdx/mise-action@v2

      - uses: taiki-e/install-action@nextest

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('shim/xmake.lua') }}
          restore-keys: |
            xmake-

      - run: mise run test

      - run: mise run build-mod

      - name: Package
        shell: pwsh
        run: |
          $mod = "shim/bin/alaydriem-stratum"
          $name = "alaydriem-stratum-$env:VERSION-client-windows-x64"
          New-Item -ItemType Directory -Force dist, symbols | Out-Null
          Move-Item "$mod/alaydriem-stratum.pdb" symbols/
          Copy-Item LICENSE "$mod/"
          Compress-Archive -Path $mod -DestinationPath "dist/$name.zip"
          Compress-Archive -Path symbols/alaydriem-stratum.pdb -DestinationPath "dist/$name-pdb.zip"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              dist/*.zip
          fi
