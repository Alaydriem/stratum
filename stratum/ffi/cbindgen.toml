language = "C"
cpp_compat = true
include_guard = "STRATUM_H"
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
no_includes = true
autogen_warning = "/* Generated by cbindgen from stratum/ffi. Do not edit: run `mise run header`. */"
documentation = true
style = "both"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = ["StStatus", "StStr", "StBytes", "StFrameStatus", "StGhostFrame", "StGhostJob", "StGhostDraw", "StGhostBlock", "StGhostReport", "StSlotBuilt"]
# the crate's constants are Rust-side bounds, none is part of the C ABI
item_types = ["enums", "structs", "opaque", "functions", "typedefs"]
