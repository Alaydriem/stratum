[workspace]
resolver = "3"
members = ["stratum/core", "stratum/ui", "stratum/ffi", "stratum/tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
crossbeam-channel = "0.5.17"
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tempfile = "3.27.0"
criterion = "=0.8.2"
thiserror = "2.0.17"
curia = "=0.2.2"
hcl-rs = "=0.19.8"
levi-ui = { path = "../crates/crates/levi-ui" }
levi-i18n = { path = "../crates/crates/levi-i18n" }
levi-i18n-tool = { path = "../crates/crates/levi-i18n-tool" }
levi-rules = { path = "../crates/crates/levi-rules" }
amm-abi = { path = "../modmanager/crates/amm-abi" }
amm-core = { path = "../modmanager/crates/amm-core" }
amm-client = { path = "../modmanager/crates/amm-client" }
stratum-core = { path = "stratum/core" }
stratum-ui = { path = "stratum/ui" }
stratum-ffi = { path = "stratum/ffi" }
stratum-tools = { path = "stratum/tools" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
